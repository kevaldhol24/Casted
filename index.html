<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2019" />
    <title>Casted</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b2019'/%3E%3Cpath d='M16 26 6 15a6 6 0 0 1 10-7 6 6 0 0 1 10 7z' fill='%23f2a43a'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #2b2019; }
      #boot {
        position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; align-content: center; gap: 22px;
        background: radial-gradient(ellipse at 50% 40%, #3a2b21, #1d1510 75%);
        color: #fff6e8; font-family: ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif;
        transition: opacity 0.45s ease;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot .teaser { width: 120px; height: 120px; perspective: 400px; }
      #boot .teaser svg { width: 100%; height: 100%; animation: spin 2.4s ease-in-out infinite; transform-origin: 50% 50%; }
      @keyframes spin { 0% { transform: rotateY(0deg); } 50% { transform: rotateY(180deg); } 100% { transform: rotateY(360deg); } }
      #boot .name { font-weight: 900; font-size: 34px; letter-spacing: 0.3em; padding-left: 0.3em; }
      #boot .bar { width: 200px; height: 8px; border-radius: 99px; background: rgba(255, 246, 232, 0.12); overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: 100%; border-radius: 99px; background: #f2a43a; transform-origin: left; transform: scaleX(0.05); animation: load 2.5s cubic-bezier(0.2, 0.7, 0.3, 1) forwards; }
      #boot.done .bar i { animation: none; transform: scaleX(1); transition: transform 0.2s ease; }
      @keyframes load { to { transform: scaleX(0.85); } }
      @media (prefers-reduced-motion: reduce) { #boot .teaser svg { animation-duration: 6s; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading">
      <div class="teaser">
        <svg viewBox="-1.1 -1.1 2.2 2.2" aria-hidden="true">
          <path fill="#f2a43a" d="M0 0.95C-0.35 0.6-1 0.25-1-0.25C-1-0.7-0.6-0.95-0.3-0.95C-0.12-0.95 0-0.82 0-0.62C0-0.82 0.12-0.95 0.3-0.95C0.6-0.95 1-0.7 1-0.25C1 0.25 0.35 0.6 0 0.95Z" />
        </svg>
      </div>
      <div class="name">CASTED</div>
      <div class="bar"><i></i></div>
    </div>
    <canvas id="game" tabindex="0"></canvas>
    <div id="ui"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
